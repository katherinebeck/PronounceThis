# render.yaml — Pronounce This ear service (Render → New → Blueprint, pick this repo)
services:
  - type: web
    name: pronouncethis-ear
    runtime: docker
    dockerfilePath: ./ear-service/Dockerfile
    dockerContext: .
    plan: standard   # 2 GB RAM
    healthCheckPath: /health
    envVars:
      - key: EAR_SECRET
        generateValue: true
      - key: PORT
        value: "8080"
